<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../public/app.css">
<style>
body{margin:0;width:1200px;height:630px;background:linear-gradient(120deg,#5b3df5,#8a3df5);display:flex;align-items:center;gap:56px;padding:0 70px;color:#fff;overflow:hidden}
.l{flex:1}.l h1{font-size:76px;margin:0 0 18px;line-height:1.02;color:#fff}.l p{font-size:31px;margin:0;opacity:.92;line-height:1.3}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;margin-bottom:30px}.brand img{width:56px;height:56px;border-radius:13px;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.card{width:440px;height:440px;max-width:none;flex:none;margin:0}.cell{font-size:13px;color:#1d1838}.cell.free{color:#fff}
</style></head><body>
<div class="l"><div class="brand"><img src="../public/icon.svg">Goal Bingo</div><h1>Your bingo card, written with friends</h1><p>Each friend writes one secret square on your card. Revealed on 1 January.</p></div>
<div class="card n5 readonly" style="--n:5" id="c"></div>
<script>
const t=["Read 12 books","Visit me in Lisbon","Run a 5k","Try pottery","Go camping","Watch a sunrise","Host a dinner","Bake bread","Finally book the dentist","Swim in the sea","Sing a full karaoke song","See a concert","FREE","Learn to juggle","Plant a garden","Write a letter","Dance class","Road trip","Go stargazing","Beat me at chess","Climb a mountain","Journal","Send me a postcard","No-phone Sunday","Learn Italian"];
const fr={1:"Ana",8:"Ben",10:"Cleo",19:"Dan",22:"Eva"};const done=new Set([0,1,2,3,4,6,18,24]);
document.getElementById('c').innerHTML=t.map((x,i)=>i==12?'<div class="cell free"><span class="t">FREE</span></div>':`<div class="cell${fr[i]?' friend':''}${done.has(i)?' done':''}"><span class="t">${x}</span>${fr[i]?`<span class="by">from ${fr[i]}</span>`:''}</div>`).join('');
</script></body></html>
